# 🚀 SAMS Java Backend - Production Ready Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=sams-java-backend
spring.profiles.active=dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:samsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sams
spring.datasource.password=sams123

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# JWT Configuration
jwt.secret=SAMSSecretKeyForJWTTokenGenerationAndValidation2024
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# WebSocket Configuration
websocket.allowed-origins=*

# Actuator Configuration
management.server.port=8081
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sams=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# System Monitoring Configuration
sams.metrics.collection.interval=5000
sams.metrics.broadcast.interval=5000
sams.alerts.check.interval=30000
sams.health-check.timeout=5000

# Mobile App Integration
sams.mobile.api.version=v1
sams.mobile.push.enabled=true
sams.mobile.websocket.enabled=true

# Web Dashboard Integration
sams.web.dashboard.enabled=true
sams.web.dashboard.realtime=true
sams.web.dashboard.refresh-interval=5000

# Performance Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=4

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Service Discovery (Consul)
spring.cloud.consul.enabled=false
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.service-name=sams-java-backend
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=30s

# Logging Configuration
logging.level.com.sams=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Performance Tuning
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Async Configuration
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# WebSocket Configuration
spring.websocket.servlet-path=/ws/*
