<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS Mobile App - React Native Web</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f23, #1f1f2e);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: #0f0f23;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .header {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            padding: 20px 16px;
            color: white;
        }

        .app-logo {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 24px;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .app-subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .nav-tabs {
            display: flex;
            background: #1f1f2e;
            border-bottom: 1px solid #374151;
            overflow-x: auto;
        }

        .nav-tab {
            flex: 1;
            min-width: 80px;
            padding: 16px 8px;
            text-align: center;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-tab.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 2px solid #3b82f6;
        }

        .nav-tab-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .content {
            padding: 16px;
            min-height: 60vh;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
        }

        .metric-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .metric-icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .metric-title {
            font-size: 12px;
            color: #d1d5db;
            font-weight: 500;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background: #374151;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .metric-subtitle {
            font-size: 10px;
            color: #9ca3af;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-card {
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .action-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .action-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .command-input {
            width: 100%;
            background: #1f1f2e;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 12px;
            resize: none;
            font-family: 'Courier New', monospace;
            min-height: 80px;
        }

        .execute-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .execute-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .command-output {
            background: #1f1f2e;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 16px;
            min-height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            margin-top: 12px;
        }

        .alert-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #3b82f6;
        }

        .alert-item.warning { border-left-color: #f59e0b; }
        .alert-item.danger { border-left-color: #ef4444; }
        .alert-item.success { border-left-color: #10b981; }

        .alert-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .alert-message {
            font-size: 12px;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .alert-time {
            font-size: 10px;
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Color constants
        const colors = {
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
            accent: '#3b82f6',
        };

        // Mock data
        const initialMetrics = {
            cpu: 45.2,
            memory: 68.7,
            disk: 82.3,
            network: 'Active',
        };

        // Components
        const Tab = ({ label, active, onPress, icon }) => (
            <button 
                className={`nav-tab ${active ? 'active' : ''}`} 
                onClick={onPress}
            >
                <span className="nav-tab-icon">{icon}</span>
                {label}
            </button>
        );

        const MetricCard = ({ title, value, progress, subtitle, color, icon }) => (
            <div className="metric-card">
                <div className="metric-header">
                    <span className="metric-icon" style={{ color }}>{icon}</span>
                    <span className="metric-title">{title}</span>
                </div>
                <div className="metric-value" style={{ color }}>{value}</div>
                <div className="progress-bar">
                    <div 
                        className="progress-fill" 
                        style={{ width: `${progress}%`, backgroundColor: color }}
                    />
                </div>
                <div className="metric-subtitle">{subtitle}</div>
            </div>
        );

        const ActionCard = ({ title, icon, color, onPress }) => (
            <button 
                className="action-card" 
                style={{ background: `linear-gradient(135deg, ${color}, ${color}dd)` }}
                onClick={onPress}
            >
                <span className="action-icon">{icon}</span>
                <div className="action-title">{title}</div>
            </button>
        );

        const AlertItem = ({ title, message, time, type }) => (
            <div className={`alert-item ${type}`}>
                <div className="alert-title">{title}</div>
                <div className="alert-message">{message}</div>
                <div className="alert-time">{time}</div>
            </div>
        );

        // Main App Component
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [metrics, setMetrics] = useState(initialMetrics);
            const [commandInput, setCommandInput] = useState('');
            const [commandOutput, setCommandOutput] = useState('Ready to execute commands...');
            const [currentTime, setCurrentTime] = useState(new Date().toLocaleTimeString());

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date().toLocaleTimeString());
                }, 1000);

                const metricsTimer = setInterval(() => {
                    setMetrics(prev => ({
                        ...prev,
                        cpu: Math.max(20, Math.min(95, prev.cpu + (Math.random() - 0.5) * 10)),
                        memory: Math.max(30, Math.min(95, prev.memory + (Math.random() - 0.5) * 5)),
                        disk: Math.max(50, Math.min(95, prev.disk + (Math.random() - 0.5) * 2)),
                    }));
                }, 3000);

                return () => {
                    clearInterval(timer);
                    clearInterval(metricsTimer);
                };
            }, []);

            const executeCommand = () => {
                if (!commandInput.trim()) {
                    setCommandOutput('Please enter a command');
                    return;
                }

                setCommandOutput('Executing command...');
                
                setTimeout(() => {
                    let result = '';
                    const cmd = commandInput.toLowerCase();
                    
                    if (cmd.includes('dir')) {
                        result = `Directory of C:\\SAMS\n\n2025-08-10  14:30    <DIR>          .\n2025-08-10  14:30    <DIR>          ..\n2025-08-10  14:25    <DIR>          backend\n2025-08-10  14:25    <DIR>          mobile-app\n2025-08-10  14:20         2,048 web_dashboard.html`;
                    } else if (cmd.includes('ipconfig')) {
                        result = `Windows IP Configuration\n\nEthernet adapter Ethernet:\n   IPv4 Address: 192.168.1.100\n   Subnet Mask: 255.255.255.0\n   Default Gateway: 192.168.1.1`;
                    } else {
                        result = `Command executed: ${commandInput}\n\nOutput would appear here in a real implementation.\nThis is the SAMS React Native mobile app interface.\n\nTimestamp: ${new Date().toLocaleString()}`;
                    }
                    
                    setCommandOutput(result);
                    setCommandInput('');
                }, 1500);
            };

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard':
                        return (
                            <div className="tab-pane active">
                                <div className="metrics-grid">
                                    <MetricCard
                                        title="CPU Usage"
                                        value={`${metrics.cpu.toFixed(1)}%`}
                                        progress={metrics.cpu}
                                        subtitle="4 cores active"
                                        color={colors.success}
                                        icon="🖥️"
                                    />
                                    <MetricCard
                                        title="Memory"
                                        value={`${metrics.memory.toFixed(1)}%`}
                                        progress={metrics.memory}
                                        subtitle="11.2 GB / 16 GB"
                                        color={colors.warning}
                                        icon="💾"
                                    />
                                    <MetricCard
                                        title="Disk Space"
                                        value={`${metrics.disk.toFixed(1)}%`}
                                        progress={metrics.disk}
                                        subtitle="411 GB / 500 GB"
                                        color={colors.danger}
                                        icon="💽"
                                    />
                                    <MetricCard
                                        title="Network"
                                        value="Active"
                                        progress={100}
                                        subtitle="1 Gbps link"
                                        color={colors.success}
                                        icon="🌐"
                                    />
                                </div>

                                <div className="section-title">Quick Actions</div>
                                <div className="actions-grid">
                                    <ActionCard
                                        title="System Monitor"
                                        icon="📈"
                                        color={colors.accent}
                                        onPress={() => setActiveTab('monitor')}
                                    />
                                    <ActionCard
                                        title="Run Commands"
                                        icon="⚡"
                                        color={colors.success}
                                        onPress={() => setActiveTab('commands')}
                                    />
                                    <ActionCard
                                        title="Generate Report"
                                        icon="📋"
                                        color={colors.warning}
                                        onPress={() => alert('Report generation feature would be implemented here.')}
                                    />
                                    <ActionCard
                                        title="View Alerts"
                                        icon="🚨"
                                        color={colors.danger}
                                        onPress={() => setActiveTab('alerts')}
                                    />
                                </div>
                            </div>
                        );

                    case 'monitor':
                        return (
                            <div className="tab-pane active">
                                <div className="section-title">Real-time System Monitoring</div>
                                <div className="metrics-grid">
                                    <MetricCard
                                        title="CPU Performance"
                                        value={`${metrics.cpu.toFixed(1)}%`}
                                        progress={metrics.cpu}
                                        subtitle="Temperature: 65°C\nLoad Average: 1.2"
                                        color={colors.accent}
                                        icon="⚡"
                                    />
                                    <MetricCard
                                        title="Memory Details"
                                        value="11.2 GB"
                                        progress={metrics.memory}
                                        subtitle="Available: 4.8 GB\nCached: 2.1 GB"
                                        color={colors.success}
                                        icon="📊"
                                    />
                                    <MetricCard
                                        title="Network Activity"
                                        value="125 MB/s"
                                        progress={80}
                                        subtitle="Upload: 45 MB/s\nDownload: 80 MB/s"
                                        color={colors.warning}
                                        icon="📈"
                                    />
                                    <MetricCard
                                        title="System Uptime"
                                        value="15d 4h 23m"
                                        progress={95}
                                        subtitle="Last restart: July 26\nProcesses: 247"
                                        color={colors.accent}
                                        icon="⏱️"
                                    />
                                </div>
                            </div>
                        );

                    case 'commands':
                        return (
                            <div className="tab-pane active">
                                <div className="section-title">Command Executor</div>
                                <textarea 
                                    className="command-input" 
                                    placeholder="Enter command (e.g., dir, ipconfig, netstat)"
                                    value={commandInput}
                                    onChange={(e) => setCommandInput(e.target.value)}
                                />
                                <button className="execute-btn" onClick={executeCommand}>
                                    Execute Command
                                </button>
                                <div className="command-output">{commandOutput}</div>
                                
                                <div className="section-title">Quick Commands</div>
                                <div className="actions-grid">
                                    <ActionCard
                                        title="Directory"
                                        icon="📁"
                                        color={colors.accent}
                                        onPress={() => { setCommandInput('dir'); executeCommand(); }}
                                    />
                                    <ActionCard
                                        title="IP Config"
                                        icon="🌐"
                                        color={colors.success}
                                        onPress={() => { setCommandInput('ipconfig'); executeCommand(); }}
                                    />
                                    <ActionCard
                                        title="Network Status"
                                        icon="🔗"
                                        color={colors.warning}
                                        onPress={() => { setCommandInput('netstat'); executeCommand(); }}
                                    />
                                    <ActionCard
                                        title="Task List"
                                        icon="📋"
                                        color={colors.danger}
                                        onPress={() => { setCommandInput('tasklist'); executeCommand(); }}
                                    />
                                </div>
                            </div>
                        );

                    case 'alerts':
                        return (
                            <div className="tab-pane active">
                                <div className="section-title">System Alerts</div>
                                <AlertItem
                                    title="⚠️ High Memory Usage"
                                    message="Memory usage has exceeded 80% threshold"
                                    time="2 minutes ago"
                                    type="warning"
                                />
                                <AlertItem
                                    title="✅ System Connected"
                                    message="Backend connection established successfully"
                                    time="5 minutes ago"
                                    type="success"
                                />
                                <AlertItem
                                    title="🚨 Disk Space Critical"
                                    message="Disk usage has reached 82% capacity"
                                    time="10 minutes ago"
                                    type="danger"
                                />
                                <AlertItem
                                    title="ℹ️ System Information"
                                    message="SAMS mobile monitoring started"
                                    time="15 minutes ago"
                                    type="info"
                                />
                            </div>
                        );

                    case 'settings':
                        return (
                            <div className="tab-pane active">
                                <div className="section-title">Application Settings</div>
                                <div className="actions-grid">
                                    <ActionCard
                                        title="Backend Config"
                                        icon="🔧"
                                        color={colors.accent}
                                        onPress={() => alert('Backend configuration would be implemented here.')}
                                    />
                                    <ActionCard
                                        title="Notifications"
                                        icon="🔔"
                                        color={colors.success}
                                        onPress={() => alert('Notification settings would be implemented here.')}
                                    />
                                    <ActionCard
                                        title="Security"
                                        icon="🔒"
                                        color={colors.warning}
                                        onPress={() => alert('Security settings would be implemented here.')}
                                    />
                                    <ActionCard
                                        title="About"
                                        icon="ℹ️"
                                        color={colors.danger}
                                        onPress={() => alert('SAMS Mobile v1.0.0\nSystem Administration & Monitoring Suite\nReact Native Web Version')}
                                    />
                                </div>
                            </div>
                        );

                    default:
                        return null;
                }
            };

            return (
                <div className="app-container">
                    {/* Header */}
                    <div className="header">
                        <div className="app-logo">
                            <div className="logo-icon">🛡️</div>
                            <div>
                                <div className="app-title">SAMS</div>
                                <div className="app-subtitle">Mobile Monitoring</div>
                            </div>
                        </div>
                        
                        <div className="status-bar">
                            <div className="status-item">
                                <div className="status-dot"></div>
                                Real-time Active
                            </div>
                            <div>{currentTime}</div>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="nav-tabs">
                        <Tab
                            label="Dashboard"
                            icon="📊"
                            active={activeTab === 'dashboard'}
                            onPress={() => setActiveTab('dashboard')}
                        />
                        <Tab
                            label="Monitor"
                            icon="📈"
                            active={activeTab === 'monitor'}
                            onPress={() => setActiveTab('monitor')}
                        />
                        <Tab
                            label="Commands"
                            icon="⚡"
                            active={activeTab === 'commands'}
                            onPress={() => setActiveTab('commands')}
                        />
                        <Tab
                            label="Alerts"
                            icon="🚨"
                            active={activeTab === 'alerts'}
                            onPress={() => setActiveTab('alerts')}
                        />
                        <Tab
                            label="Settings"
                            icon="⚙️"
                            active={activeTab === 'settings'}
                            onPress={() => setActiveTab('settings')}
                        />
                    </div>

                    {/* Content */}
                    <div className="content">
                        {renderContent()}
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
