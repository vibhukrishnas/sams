---
# SAMS Infrastructure as Code - Ansible Playbook
# Following distributed systems best practices

- name: "SAMS Distributed Monitoring Setup"
  hosts: sams_cluster
  become: yes
  vars:
    sams_version: "2.0.0"
    monitoring_port: 8080
    consul_datacenter: "sams-dc1"
    
  tasks:
    # 1. System Preparation (Following Best Practices)
    - name: "Update system packages"
      package:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
    
    - name: "Install required packages"
      package:
        name:
          - python3
          - python3-pip
          - curl
          - wget
          - htop
          - net-tools
        state: present
    
    # 2. Python Environment Setup
    - name: "Install Python dependencies"
      pip:
        name:
          - flask
          - flask-cors
          - psutil
          - aiohttp
          - python-consul
          - pyyaml
          - prometheus-client
        state: present
    
    # 3. SAMS Application Deployment
    - name: "Create SAMS user"
      user:
        name: sams
        system: yes
        shell: /bin/bash
        home: /opt/sams
        createhome: yes
    
    - name: "Create SAMS directories"
      file:
        path: "{{ item }}"
        state: directory
        owner: sams
        group: sams
        mode: '0755'
      loop:
        - /opt/sams
        - /opt/sams/config
        - /opt/sams/logs
        - /opt/sams/certs
        - /var/log/sams
    
    - name: "Deploy SAMS application files"
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: sams
        group: sams
        mode: '0644'
      loop:
        - { src: "distributed_monitor.py", dest: "/opt/sams/distributed_monitor.py" }
        - { src: "distributed-config.yml", dest: "/opt/sams/config/distributed-config.yml" }
    
    # 4. Service Discovery Setup (Consul)
    - name: "Download Consul binary"
      get_url:
        url: "https://releases.hashicorp.com/consul/1.17.0/consul_1.17.0_linux_amd64.zip"
        dest: "/tmp/consul.zip"
    
    - name: "Extract Consul"
      unarchive:
        src: "/tmp/consul.zip"
        dest: "/usr/local/bin/"
        remote_src: yes
        owner: root
        group: root
        mode: '0755'
    
    - name: "Create Consul configuration"
      template:
        src: consul.json.j2
        dest: /etc/consul.json
        mode: '0644'
      notify: restart consul
    
    - name: "Create Consul systemd service"
      copy:
        content: |
          [Unit]
          Description=Consul
          Documentation=https://www.consul.io/
          Requires=network-online.target
          After=network-online.target
          ConditionFileNotEmpty=/etc/consul.json
          
          [Service]
          Type=notify
          User=consul
          Group=consul
          ExecStart=/usr/local/bin/consul agent -config-dir=/etc/consul.d
          ExecReload=/bin/kill -HUP $MAINPID
          KillMode=process
          Restart=on-failure
          LimitNOFILE=65536
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/consul.service
        mode: '0644'
      notify: 
        - reload systemd
        - restart consul
    
    # 5. Monitoring Stack Setup
    - name: "Install Prometheus Node Exporter"
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
    
    - name: "Extract Node Exporter"
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp/"
        remote_src: yes
    
    - name: "Install Node Exporter binary"
      copy:
        src: "/tmp/node_exporter-1.7.0.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes
    
    - name: "Create Node Exporter systemd service"
      copy:
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target
          
          [Service]
          Type=simple
          User=sams
          ExecStart=/usr/local/bin/node_exporter
          Restart=on-failure
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
      notify:
        - reload systemd
        - restart node_exporter
    
    # 6. SAMS Service Configuration
    - name: "Create SAMS systemd service"
      copy:
        content: |
          [Unit]
          Description=SAMS Distributed Monitor
          After=network.target consul.service
          Wants=consul.service
          
          [Service]
          Type=simple
          User=sams
          Group=sams
          WorkingDirectory=/opt/sams
          ExecStart=/usr/bin/python3 distributed_monitor.py
          Restart=always
          RestartSec=10
          Environment=PYTHONPATH=/opt/sams
          
          # Logging
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=sams-monitor
          
          # Security
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/opt/sams/logs /var/log/sams
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/sams-monitor.service
        mode: '0644'
      notify:
        - reload systemd
        - restart sams-monitor
    
    # 7. Network and Security Configuration
    - name: "Configure firewall for SAMS"
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - "8080/tcp"  # SAMS API
        - "8500/tcp"  # Consul UI
        - "9100/tcp"  # Node Exporter
      when: ansible_os_family == "RedHat"
    
    - name: "Generate SSL certificates for SAMS"
      command: |
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 
        -keyout /opt/sams/certs/sams-server.key 
        -out /opt/sams/certs/sams-server.crt
        -subj "/C=US/ST=State/L=City/O=SAMS/CN={{ ansible_fqdn }}"
      args:
        creates: /opt/sams/certs/sams-server.crt
    
    - name: "Set certificate permissions"
      file:
        path: "{{ item }}"
        owner: sams
        group: sams
        mode: '0600'
      loop:
        - /opt/sams/certs/sams-server.key
        - /opt/sams/certs/sams-server.crt
    
    # 8. Log Rotation Configuration
    - name: "Configure log rotation for SAMS"
      copy:
        content: |
          /var/log/sams/*.log {
              daily
              missingok
              rotate 30
              compress
              delaycompress
              notifempty
              create 644 sams sams
              postrotate
                  systemctl reload sams-monitor
              endscript
          }
        dest: /etc/logrotate.d/sams
        mode: '0644'

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
    
    - name: restart consul
      systemd:
        name: consul
        state: restarted
        enabled: yes
    
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        enabled: yes
    
    - name: restart sams-monitor
      systemd:
        name: sams-monitor
        state: restarted
        enabled: yes
