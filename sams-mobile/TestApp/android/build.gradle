// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Define version variables for better maintainability and consistency
    ext {
        // Android SDK versions - keep these updated for security and feature support
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        
        // Updated Kotlin version for better compatibility with Android Gradle Plugin 8.1.1
        // Using 1.8.22 for better compatibility with React Native
        kotlinVersion = "1.8.22"
        
        // Build optimization flags
        enableBuildCache = true
        enableParallelBuilds = true
    }
    
    repositories {
        // Optimized repository order - most frequently used first
        google()
        mavenCentral()
        // Removed duplicate repositories for better performance
    }
    
    dependencies {
        // Use stable versions for React Native compatibility
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin:0.73.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Global project configuration
allprojects {
    repositories {
        // Optimized repository configuration - removed duplicates
        google()
        mavenCentral()
        maven { 
            url "https://www.jitpack.io"
            // Add content filtering for better performance
            content {
                includeGroupByRegex "com\\.github\\..*"
            }
        }
        // Removed duplicate maven.google.com as it's redundant with google()
    }
    
    // Global build optimizations
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
            // Enable incremental compilation for faster builds
            incremental = true
        }
    }
}

// Build performance optimizations
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        // Enable incremental compilation
        options.incremental = true
    }
}

// Error handling and validation for release builds
gradle.taskGraph.whenReady { taskGraph ->
    // Validate that required properties are set for release builds
    if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask(":app:bundleRelease")) {
        def requiredProps = [
            'SAMS_UPLOAD_STORE_FILE',
            'SAMS_UPLOAD_STORE_PASSWORD', 
            'SAMS_UPLOAD_KEY_ALIAS',
            'SAMS_UPLOAD_KEY_PASSWORD'
        ]
        
        def missingProps = requiredProps.findAll { !project.hasProperty(it) }
        if (!missingProps.empty) {
            logger.warn("WARNING: Missing release signing properties: ${missingProps.join(', ')}")
            logger.warn("Release build will use debug keystore as fallback")
        }
    }
}

// Enhanced clean task
task clean(type: Delete) {
    delete rootProject.buildDir
    // Also clean React Native cache for fresh builds
    delete "${rootProject.projectDir}/node_modules/.cache"
}
