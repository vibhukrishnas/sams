server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sams-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/sams
    username: sams
    password: sams
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

logging:
  level:
    com.sams: DEBUG
    org.springframework.security: DEBUG
